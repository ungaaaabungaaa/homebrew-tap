name: Formula checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formula:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_MAKE_JOBS: 1
    steps:
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          stable: true
      - name: Formula style
        run: brew style ungaaaabungaaa/tap/qeth
      - name: Formula audit
        run: brew audit --strict ungaaaabungaaa/tap/qeth
      - name: Install published release
        run: brew install ungaaaabungaaa/tap/qeth
      - name: Installed behavior
        run: brew test ungaaaabungaaa/tap/qeth
